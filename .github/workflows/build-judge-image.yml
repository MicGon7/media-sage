name: Build and Push Judge Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.judge'
      - 'agent/judge-entrypoint.sh'
      - 'agent/get-github-token.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build judge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.judge
          platforms: linux/amd64
          push: true
          tags: us-central1-docker.pkg.dev/media-sage-agent/media-sage-agent/judge:latest
