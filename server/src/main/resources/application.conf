# Ktor server configuration (HOCON format)
# Environment variables override defaults using ${?ENV_VAR} syntax
# The ? means "optional" — if the env var isn't set, the default value is kept

ktor {
    deployment {
        # Server bind address and port
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }

    application {
        # Points to the module function that installs plugins and routes
        # When using EngineMain, Ktor calls this function automatically
        modules = [com.mediasage.server.ApplicationKt.module]
    }
}

# App-specific configuration — API keys loaded from environment variables
# No defaults for secrets — they MUST come from the environment
app {
    claude {
        apiKey = ${?CLAUDE_API_KEY}
    }

    news {
        apiKey = ${?NEWS_API_KEY}
    }

    scripture {
        apiKey = ${?SCRIPTURE_API_KEY}
    }

    agent {
        # Absolute path to the repo root — working directory for the spawned Claude Code process
        repoPath = ${?AGENT_REPO_PATH}
    }
}
