# Analyst feedback server — port 8082
# Reactive consumer of pipeline completion events. Subscribes to the Pub/Sub
# completion topic and exposes cross-run analytics over the existing jobs table.

ktor {
    deployment {
        host = "0.0.0.0"
        port = 8082
        port = ${?PORT}
    }

    application {
        modules = [com.mediasage.analyst.ApplicationKt.module]
    }
}

app {
    supabase {
        dbUrl = ${?SUPABASE_DB_URL}
    }

    pubSub {
        # Shared secret appended as ?token= to the Pub/Sub push subscription URL
        webhookSecret = ${?PUBSUB_WEBHOOK_SECRET}
    }

    claude {
        # Auth token for ClaudeDecisionScorer. When absent, decision scoring is disabled.
        # Matches the ANTHROPIC_AUTH_TOKEN / ANTHROPIC_BASE_URL pattern used by workers.
        authToken = ${?ANTHROPIC_AUTH_TOKEN}
        baseUrl = "https://api.anthropic.com"
        baseUrl = ${?ANTHROPIC_BASE_URL}
    }

    github {
        # GitHub App credentials for the auto-PR feature. All five must be set for the
        # feature to activate; missing any one silently disables it.
        appId = ${?GITHUB_APP_ID}
        privateKey = ${?GITHUB_PRIVATE_KEY}
        installationId = ${?GITHUB_INSTALLATION_ID}
        repoOwner = ${?GITHUB_REPO_OWNER}
        repoName = ${?GITHUB_REPO_NAME}
    }
}
