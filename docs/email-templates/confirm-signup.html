<!-- Supabase Auth "Confirm signup" template for The Courage Post.
     Paste the <body> contents into Supabase → Authentication → Emails → Templates → Confirm signup.
     Replace ICON_URL with the public URL of email-icon-192.png (host it in a public
     Supabase Storage bucket). Palette mirrors composeApp/theme/Color.kt:
     ComicCream FBF3E1 / ComicTan F0DFB8 / ComicBrown 9C6B3E / Ink 1A1A1A / Slate 6B6B6B. -->
<body style="margin:0; padding:0; background-color:#F0DFB8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F0DFB8; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#FBF3E1; border:1px solid #9C6B3E; padding:32px 28px;">

          <!-- Masthead -->
          <tr>
            <td align="center" style="font-family:Georgia, 'Times New Roman', serif;">
              <div style="border-top:1px solid #6B6B6B; border-bottom:1px solid #6B6B6B; padding:6px 0; margin-bottom:12px;">
                <span style="font-size:11px; font-style:italic; letter-spacing:3px; color:#6B6B6B;">MEMBER&nbsp;EDITION</span>
              </div>
              <div style="border-top:2px solid #1B2A4A; padding-top:14px;">
                <span style="font-size:26px; font-weight:bold; letter-spacing:5px; color:#1A1A1A;">THE&nbsp;COURAGE</span><br>
                <span style="font-size:40px; letter-spacing:12px; color:#1A1A1A;">POST</span>
              </div>
              <div style="border-bottom:2px solid #1B2A4A; padding-bottom:12px; margin-top:10px;">
                <span style="font-size:13px; font-style:italic; color:#6B6B6B;">Voices from the past. Courage for the present.</span>
              </div>
            </td>
          </tr>

          <!-- Icon -->
          <tr>
            <td align="center" style="padding:28px 0 8px 0;">
              <img src="ICON_URL" width="96" height="96" alt="The Courage Post"
                   style="display:block; border:1px solid #9C6B3E; border-radius:12px;">
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td align="center" style="font-family:Georgia, 'Times New Roman', serif; padding-top:16px;">
              <h2 style="margin:0 0 12px 0; font-size:20px; font-weight:bold; color:#1A1A1A;">Confirm your signup</h2>
              <p style="margin:0 0 24px 0; font-size:15px; line-height:1.5; color:#6B6B6B;">
                Enter this code in the app to finish creating your account:
              </p>
              <div style="display:inline-block; border:2px solid #9C6B3E; background-color:#F0DFB8; padding:14px 28px;">
                <span style="font-family:Georgia, 'Times New Roman', serif; font-size:34px; font-weight:bold; letter-spacing:10px; color:#1B2A4A;">{{ .Token }}</span>
              </div>
              <p style="margin:24px 0 0 0; font-size:13px; line-height:1.5; color:#6B6B6B;">
                This code expires in one hour.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="font-family:Georgia, 'Times New Roman', serif; padding-top:28px;">
              <div style="border-top:1px solid #6B6B6B; padding-top:12px;">
                <span style="font-size:12px; font-style:italic; color:#6B6B6B;">
                  If you didn't request this, you can safely ignore this email.<br>
                  thecouragepost.app
                </span>
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
