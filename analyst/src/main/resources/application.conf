# Analyst feedback server — port 8082
# Reactive consumer of pipeline completion events. Subscribes to the Pub/Sub
# completion topic and exposes cross-run analytics over the existing jobs table.

ktor {
    deployment {
        host = "0.0.0.0"
        port = 8082
        port = ${?PORT}
    }

    application {
        modules = [com.mediasage.analyst.ApplicationKt.module]
    }
}

app {
    supabase {
        dbUrl = ${?SUPABASE_DB_URL}
    }

    pubSub {
        # Shared secret appended as ?token= to the Pub/Sub push subscription URL
        webhookSecret = ${?PUBSUB_WEBHOOK_SECRET}
    }

    claude {
        # Anthropic API key used by ClaudeDecisionScorer. When absent, decision scoring is disabled.
        apiKey = ${?CLAUDE_API_KEY}
    }
}
