name: Build and Push Worker Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.worker'
      - 'agentruntime/worker-entrypoint.sh'
      - 'agentruntime/entrypoint-common.sh'
      - 'agentruntime/get-github-token.py'
      - 'scripts/**'
      - 'gradlew'
      - 'gradle/wrapper/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'agentruntime/build.gradle.kts'
      - 'appServer/build.gradle.kts'
      - 'composeApp/build.gradle.kts'
      - 'shared/build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-worker-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: us-central1-docker.pkg.dev/media-sage-agent/media-sage-agent/worker:latest
