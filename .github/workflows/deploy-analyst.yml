name: Build and Deploy Analyst

on:
  push:
    branches: [ main ]
    paths:
      - 'feedback/**'
      - 'settings-feedback.gradle.kts'
      - 'pipeline-core/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push analyst image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: feedback/Dockerfile
          platforms: linux/amd64
          push: true
          tags: us-central1-docker.pkg.dev/media-sage-agent/media-sage-agent/analyst:latest

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy media-sage analyst
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: media-sage-analyst
          image: us-central1-docker.pkg.dev/media-sage-agent/media-sage-agent/analyst:latest
          region: us-central1
          # Analyst is never in the critical path — Pub/Sub push retries on cold start,
          # so it scales to zero (unlike the orchestrator's --min-instances=1).
          flags: '--min-instances=0'
