name: Jira Auto-Transition

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  transition-ticket:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extract Jira ticket key from branch name
        id: extract
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TICKET=$(echo "$BRANCH" | grep -oE 'MS-[0-9]+' | head -1)
          if [ -z "$TICKET" ]; then
            echo "No Jira ticket found in branch name: $BRANCH"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition ticket to Done
        if: steps.extract.outputs.found == 'true'
        run: |
          curl -s -X POST \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"transition":{"id":"31"}}' \
            "https://media-sage.atlassian.net/rest/api/3/issue/${{ steps.extract.outputs.ticket }}/transitions"
          echo "Transitioned ${{ steps.extract.outputs.ticket }} to Done"
