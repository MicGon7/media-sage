name: Dockerfile CI

on:
  push:
    branches: [ main ]
    paths:
      - 'orchestrator/Dockerfile'
  pull_request:
    branches: [ main ]
    paths:
      - 'orchestrator/Dockerfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: orchestrator/Dockerfile
          config: .hadolint.yaml
          ignore: DL3008

      - name: Build orchestrator image
        run: docker build -f orchestrator/Dockerfile -t media-sage-agent-test .

      - name: Smoke test runtime dependencies
        run: |
          docker run --rm --entrypoint which media-sage-agent-test javac
          docker run --rm --entrypoint which media-sage-agent-test java
