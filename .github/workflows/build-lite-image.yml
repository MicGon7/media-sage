name: Build and Push Lite Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.lite'
      - 'orchestrator/lite-entrypoint.sh'
      - 'orchestrator/entrypoint-common.sh'
      - 'orchestrator/get-github-token.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build lite image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lite
          platforms: linux/amd64
          push: true
          tags: us-central1-docker.pkg.dev/media-sage-agent/media-sage-agent/lite:latest

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Update Cloud Run Jobs to lite image
        run: |
          IMAGE=us-central1-docker.pkg.dev/media-sage-agent/media-sage-agent/lite:latest
          for JOB in media-sage-agent-judge media-sage-agent-comment; do
            gcloud run jobs update "$JOB" \
              --image "$IMAGE" \
              --region us-central1 \
              --project media-sage-agent
          done
