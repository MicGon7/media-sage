name: Build and Deploy Orchestrator

on:
  push:
    branches: [ main ]
    paths:
      - 'agent/**'
      - 'settings-agent.gradle.kts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: us-central1-docker.pkg.dev/media-sage-agent/media-sage-agent/orchestrator:latest

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy media-sage orchestrator
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: media-sage-orchestrator
          image: us-central1-docker.pkg.dev/media-sage-agent/media-sage-agent/orchestrator:latest
          region: us-central1

      - name: Deploy pipe orchestrator
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: agent-orchestrator-pipe
          image: us-central1-docker.pkg.dev/media-sage-agent/media-sage-agent/orchestrator:latest
          region: us-central1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Post-deploy canary — verify pipeline health
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./gradlew :pipelineScenarios:e2eDedupCompleted
