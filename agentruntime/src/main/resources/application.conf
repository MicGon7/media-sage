# Agent orchestration server — port 8081
# Handles Jira and GitHub webhooks that trigger autonomous Claude Code agents

ktor {
    deployment {
        host = "0.0.0.0"
        port = 8081
        port = ${?PORT}
    }

    application {
        modules = [com.mediasage.agentruntime.ApplicationKt.module]
    }
}

app {
    github {
        # Secret configured in GitHub → repo Settings → Webhooks
        webhookSecret = ${?GITHUB_WEBHOOK_SECRET}
        # GitHub login of the App bot (used to ignore the agent's own webhook events).
        # For GitHub Apps this includes the [bot] suffix, e.g. "media-sage-worker[bot]"
        botLogin = ${?GITHUB_BOT_LOGIN}
    }

    jira {
        email = ${?JIRA_EMAIL}
        apiToken = ${?JIRA_API_TOKEN}
        # Cloud ID for media-sage.atlassian.net
        cloudId = "ad358528-f7e9-4e40-9531-c51049908d6d"
        cloudId = ${?JIRA_CLOUD_ID}
        # Jira account ID of the bot user — ticket assigned to this account + In Progress triggers the agent
        botAccountId = ${?JIRA_BOT_ACCOUNT_ID}
        # Bot account credentials — used to post automated comments as the bot
        botEmail = ${?JIRA_BOT_EMAIL}
        botApiToken = ${?JIRA_BOT_API_TOKEN}
    }

    supabase {
        dbUrl = ${?SUPABASE_DB_URL}
    }

    pubSub {
        # Shared secret appended as ?token= to the Pub/Sub push subscription URL
        webhookSecret = ${?PUBSUB_WEBHOOK_SECRET}
    }

    cloudRun {
        projectId = ${?GCP_PROJECT_ID}
        region = "us-central1"
        region = ${?GCP_REGION}
        jobName = "media-sage-agent-worker"
        jobName = ${?GCP_JOB_NAME}
        # SA JSON key content — base64-encoded to survive Railway env var line break handling
        credentialsBase64 = ${?GOOGLE_CREDENTIALS_BASE64}
    }

    claude {
        # Auth token for the AC-compliance judge (same token used by workers via Fuelix proxy).
        # When absent (with the GitHub App vars), the judge is disabled.
        authToken = ${?ANTHROPIC_AUTH_TOKEN}
        baseUrl = "https://api.anthropic.com"
        baseUrl = ${?ANTHROPIC_BASE_URL}
        model = "claude-sonnet-4-6"
        model = ${?ANTHROPIC_MODEL}
    }

    slack {
        # Incoming-webhook URL for job-completion notifications. When absent, no messages are posted.
        webhookUrl = ${?SLACK_WEBHOOK_URL}
    }

    githubApp {
        # GitHub App credentials. Used by the AC-compliance judge to read PR details/diffs via a
        # short-lived installation token. All five must be set for the judge to activate; missing
        # any one disables it silently.
        githubAppId = ${?GITHUB_APP_ID}
        githubPrivateKey = ${?GITHUB_APP_PRIVATE_KEY_BASE64}
        githubInstallationId = ${?GITHUB_APP_INSTALLATION_ID}
        githubRepoOwner = ${?GITHUB_OWNER}
        githubRepoName = ${?GITHUB_REPO}
    }
}
